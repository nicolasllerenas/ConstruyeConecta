name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm env:local
      - run: pnpm db:up
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start services
        run: nohup node --env-file=.env infra/dev/run.mjs > dev.log 2>&1 &
      - name: Wait for web
        run: timeout 120 bash -c 'until curl -sf http://localhost:3100/login > /dev/null; do sleep 2; done'
      - run: pnpm test:e2e
      - name: Service logs
        if: failure()
        run: cat dev.log

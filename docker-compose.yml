services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: construyeconecta
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d construyeconecta"]
      interval: 2s
      timeout: 2s
      retries: 20
